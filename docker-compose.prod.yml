# Production overlay — a second local stack, same host, same source/build
# contexts as docker-compose.yml. Deployed via a git-push + docker-rebuild
# flow (AIwebmaster's old CMS-content-only "publish" action was removed
# along with Payload CMS). See docs/planning/14_DECISION_LOG.md (D9) for why
# this is same-host rather than a separate server for now.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml -p rewamped-site up -d web-prod api-prod
services:
  api-prod:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://tbg:tbg_dev@postgres:5432/tbg_api_prod
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COLUMBUS_WEBHOOK_SECRET: ${COLUMBUS_WEBHOOK_SECRET:-}
      COLUMBUS_N8N_WEBHOOK_URL: ${COLUMBUS_N8N_WEBHOOK_URL:-}
      COLUMBUS_N8N_WEBHOOK_SECRET: ${COLUMBUS_N8N_WEBHOOK_SECRET:-}
      DEBUG: "false"
      ENVIRONMENT: production
    volumes:
      - api_reports_prod:/app/data/reports
    depends_on:
      postgres:
        condition: service_healthy

  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3102:3002"
    environment:
      NEXT_PUBLIC_API_URL: http://api-prod:8000
    depends_on:
      - api-prod

volumes:
  api_reports_prod:
