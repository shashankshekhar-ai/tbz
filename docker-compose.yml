services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbg
      POSTGRES_PASSWORD: tbg_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbg"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      DATABASE_URI: postgresql://tbg:tbg_dev@postgres:5432/tbg_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-changeme_in_production}
      NEXT_PUBLIC_WEB_URL: https://tbz-web.vercel.app
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tbg:tbg_dev@postgres:5432/tbg_api
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEBUG: "true"
      ENVIRONMENT: development
    volumes:
      - api_reports:/app/data/reports
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_CMS_URL: http://cms:3003
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - cms
      - api

volumes:
  pgdata:
  api_reports:
