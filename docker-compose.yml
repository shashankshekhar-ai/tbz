services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbg
      POSTGRES_PASSWORD: tbg_dev
      POSTGRES_MULTIPLE_DATABASES: tbg_cms,tbg_api
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh

volumes:
  pgdata:
