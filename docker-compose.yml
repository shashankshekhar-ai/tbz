services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbg
      POSTGRES_PASSWORD: tbg_dev
    ports:
      # Bound to localhost only — every in-container service already reaches
      # postgres over the internal compose network by name (postgres:5432);
      # this mapping exists purely for host-side psql/GUI debugging and must
      # never be reachable from outside this machine (e.g. on an AWS
      # security group with an open 5433, "0.0.0.0:5433" would be internet-
      # reachable with the weak default password above).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbg"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      DATABASE_URI: postgresql://tbg:tbg_dev@postgres:5432/tbg_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-changeme_in_production}
      NEXT_PUBLIC_WEB_URL: https://tbz-web.vercel.app
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CMS_SERVICE_TOKEN: ${CMS_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://tbg:tbg_dev@postgres:5432/tbg_api
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEBUG: "true"
      ENVIRONMENT: development
    volumes:
      - api_reports:/app/data/reports
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    # NEXT_PUBLIC_* vars are inlined at build time (see apps/web/Dockerfile ARGs),
    # not read at container runtime — setting them here would be a silent no-op.
    depends_on:
      - cms
      - api

  # Standalone ops+content agent — proposes content/nav/git/docker/sql actions,
  # executes only what a human approves via the UI. Not exposed publicly
  # (127.0.0.1-only); holds docker-socket + repo access other services don't get.
  # See docs/planning/14_DECISION_LOG.md (D9) and apps/aiwebmaster/README if present.
  aiwebmaster:
    build:
      context: ../aiwebmaster
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8010"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-}
      AIWEBMASTER_ADMIN_EMAIL: ${AIWEBMASTER_ADMIN_EMAIL:-}
      AIWEBMASTER_ADMIN_PASSWORD: ${AIWEBMASTER_ADMIN_PASSWORD:-}
      CMS_SERVICE_TOKEN: ${CMS_SERVICE_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CMS_URL: http://cms:3003
      REPO_PATH: /repo
      # Real docker compose project name for this stack — every docker/
      # publish/rollback/codegen_agent/Agent Terminal executor passes this
      # as `-p`. Must match whatever `-p` this stack was actually brought
      # up with (`docker compose ps` / `docker ps` container name prefix);
      # a mismatch silently targets an empty project instead of erroring.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT:-rewamped-site}
      # Real host path of this checkout — required as `docker compose
      # run --rm --project-directory ...` for claude-agent/codex-agent
      # (core/executors.py, core/agent_stream.py), since their bind-mount
      # volumes are resolved by the HOST daemon, which knows nothing about
      # this container's own /repo view. Must match wherever this repo
      # actually lives on the host; override in .env if that ever changes.
      HOST_REPO_PATH: ${HOST_REPO_PATH:-/home/shashank/project/tbg/rewamped-site}
      API_DATABASE_URL: postgresql://tbg:tbg_dev@postgres:5432/tbg_api
      CMS_DATABASE_URL: postgresql://tbg:tbg_dev@postgres:5432/tbg_cms
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_REDIRECT_URI: ${AUTH0_REDIRECT_URI:-http://localhost:8110/api/auth/auth0/callback}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      - aiwebmaster_data:/app/data
      # Same host path both inside and outside the container so
      # infra/scripts/backup-dbs.sh (which shells out to `docker exec
      # tbz-postgres-1 pg_dump`, not an in-process DB driver) works
      # unchanged whether invoked by the host systemd timer or from in here.
      - /home/admin/tbg/db-backups:/home/admin/tbg/db-backups
      # Mount a dedicated deploy-only SSH key here if git push should work:
      # - ${AIWEBMASTER_DEPLOY_SSH_KEY_PATH:-/dev/null}:/root/.ssh/id_deploy:ro
    depends_on:
      postgres:
        condition: service_healthy
      cms:
        condition: service_started

  # Isolated Claude Code CLI sandbox — full agentic tool access (its own
  # file-edit + bash, no propose/approve gate), but structurally cut off
  # from prod: own network (`sandbox`, not attached to any other service —
  # cannot resolve or route to postgres/cms-prod/etc even if instructed to),
  # no docker socket, no root .env, no prod DB creds. Only the dev app
  # source directories are bind-mounted, read-write. Every code/docker/git/
  # sql/publish action still goes through AIwebmaster's existing propose->
  # approve->RBAC->audit pipeline unchanged — this container can edit dev
  # source files, nothing more.
  #
  # Not a long-running service: invoke on demand, e.g.
  #   docker compose run --rm claude-agent "add a loading spinner to the contact form"
  claude-agent:
    build:
      context: ./infra/claude-agent
      dockerfile: Dockerfile
    environment:
      # Leave unset to use browser/device-code login instead (`claude` stores
      # the session in claude_agent_home, persisted across runs). Only set
      # this if you'd rather pay per-token via the API instead of using an
      # existing Claude subscription's included usage.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./apps/cms:/workspace/apps/cms
      - ./apps/api:/workspace/apps/api
      - ../aiwebmaster:/workspace/apps/aiwebmaster
      - claude_agent_home:/home/node/.claude
      - claude_agent_transcripts:/transcripts
    networks:
      - sandbox
    stdin_open: true
    tty: true

  # Isolated OpenAI Codex CLI sandbox — same isolation model as
  # claude-agent above (own `sandbox` network, no docker socket, no root
  # .env, no prod DB creds, only dev app source directories bind-mounted
  # read-write). AIwebmaster's `codegen_agent` action picks between this
  # and claude-agent per-request (core/codegen_router.py); manual use:
  #   docker compose run --rm codex-agent "add a loading spinner to the contact form"
  codex-agent:
    build:
      context: ./infra/codex-agent
      dockerfile: Dockerfile
    environment:
      # Leave unset to use browser/device-code login instead (`codex`
      # stores the session in codex_agent_home, persisted across runs).
      # Only set this if you'd rather pay per-token via the API instead of
      # using an existing ChatGPT subscription's included usage.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./apps/cms:/workspace/apps/cms
      - ./apps/api:/workspace/apps/api
      - ../aiwebmaster:/workspace/apps/aiwebmaster
      - codex_agent_home:/root/.codex
      - codex_agent_transcripts:/transcripts
    networks:
      - sandbox
    stdin_open: true
    tty: true

networks:
  sandbox: {}

volumes:
  pgdata:
  api_reports:
  aiwebmaster_data:
  claude_agent_home:
  claude_agent_transcripts:
  codex_agent_home:
  codex_agent_transcripts:
